      - Microsoft.PowerApps.Administration.PowerShell.psm1:7290 (Set-DlpPolicy)
      x-caveats:
      - '[S] Set-DlpPolicy sends -UpdatedPolicy as the PATCH body unchanged.'
      - '[S] Add-ConnectorsToPolicy reads the policy with Get Policy, edits connectorGroups[].connectors in place, and PATCHes
