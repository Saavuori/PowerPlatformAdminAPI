openapi: 3.0.3
info:
  title: Power Platform admin (BAP) API — unofficial
  version: 2.0.219
  description: UNOFFICIAL. Reverse-documented from Microsoft.PowerApps.Administration.PowerShell 2.0.219. Routes may change
    without notice. x-confidence and x-basis mark what is verified from source (S), documented on Learn (D) or inferred (I).
servers:
- url: https://api.bap.microsoft.com
  description: Commercial (prod). See Common concepts for other clouds.
tags:
- name: Policies
  description: Tenant- and environment-scoped data policies (DLP) in the current schema, as used by Get-/New-/Set-/Remove-DlpPolicy.
    These are the routes the admin center's policy editor is believed to use; the module calls them without an api-version.
- name: Policy Connector Configurations
  description: Connector action rules and endpoint filtering rules attached to one data policy.
- name: Policy Exempt Resources
  description: Apps and flows exempted from one data policy.
- name: URL Patterns
  description: Custom connector URL pattern rules, per policy (tenant-level policies only) and tenant-wide.
- name: Connector Blocking Policy
  description: The tenant's connector blocking (connector enablement) policy, used to disable connectors tenant-wide. The
    cmdlets call it "connector blocking policy"; the route calls it connectorEnablementConfigurations.
- name: Governance Error Settings
  description: Governance error message content (link and contact) shown to makers when a policy blocks them. Two cmdlet families
    (PowerAppDlpErrorSettings and GovernanceErrorSettings) call the same routes.
- name: Tenant Isolation Policy
  description: Cross-tenant inbound and outbound connection restrictions.
- name: Governance Connectors
  description: Connector catalog lookups used when building policies (actions, virtual connectors, desktop flow modules).
- name: DLP Enforcement
  description: Background jobs that re-evaluate existing connections against data policies.
- name: Legacy API Policies
  description: The original DLP schema (hbi/lbi API groups) on Microsoft.BusinessAppPlatform, used by Get-/New-/Set-/Remove-AdminDlpPolicy
    and the *ConnectorToBusinessDataGroup cmdlets. Prefer the Policies group for new work.
- name: Copilot Governance
  description: Per-environment Copilot governance settings on the Power Platform API host.
- name: Admin Applications
  description: Registration of Microsoft Entra applications (service principals) as Power Platform management apps.
- name: Tenant Settings
  description: Tenant-wide settings, consent plans, quota and licence export.
- name: Environment Role Assignments
  description: Environment Admin and Environment Maker role assignments, and user sync into Dataverse.
- name: Environment Backup and Restore
  description: Backups, restore, copy and reset of environments.
- name: Customer-Managed Keys
  description: Encryption key management for environments (customer-managed keys).
- name: Tenant-to-Tenant Migration
  description: Moving environments between tenants.
- name: Legacy CDS 1.0
  description: Common Data Service 1.0 databases (retired product). Kept for completeness.
- name: Environment Provisioning Metadata
  description: Locations, currencies, languages and templates for environment and database provisioning.
- name: Environments
  description: Environment lifecycle and properties.
- name: Apps
  description: Canvas app administration.
- name: Connectors and Connections
  description: Custom connectors, connections and their permissions.
- name: Flows
  description: Power Automate cloud flow administration on the Flow API host.
- name: Users and Reports
  description: User data export and enforcement reports.
paths:
  /providers/PowerPlatform.Governance/v1/policies:
    get:
      tags:
      - Policies
      summary: Policies - List Policies
      description: 'Lists the data policies (DLP) in the signed-in admin''s tenant, current schema.


        Undocumented. Derived from Microsoft.PowerApps.Administration.PowerShell 2.0.219.'
      operationId: Policies_ListPolicies
      parameters:
      - name: $top
        in: query
        required: false
        schema:
          type: string
        description: Module sends `50`. [S]
      responses:
        '200':
          description: Success. Exact 2xx code not captured; the module accepts any 2xx [I].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        default:
          description: Error body as read by the REST client [S].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bapToken: []
      x-confidence:
        route: Verified from source
        api_version: 'Verified from source: no api-version is sent'
        body: No body
        response: Inferred
        live: Not verified live
      x-cmdlets:
      - Get-DlpPolicy
      x-source:
      - Microsoft.PowerApps.Administration.PowerShell.psm1:7158 (Get-DlpPolicy)
      x-caveats:
      - '[S] The module requests $top=50 and InvokeApi follows nextLink until it is absent, concatenating value arrays.'
      - '[S] No api-version is sent. Get-DlpPolicy accepts -ApiVersion (default 2016-11-01) but the route has no {apiVersion}
        placeholder, so the value is never used.'
      - '[D] Policies read through PowerShell list only connectors that were explicitly classified; unmoved connectors in
        the default group are not returned, and connector display names can be stale (Learn: PowerShell support for Power
        Apps).'
    post:
      tags:
      - Policies
      summary: Policies - Create Policy
      description: 'Creates a data policy in the tenant.


        Undocumented. Derived from Microsoft.PowerApps.Administration.PowerShell 2.0.219.'
      operationId: Policies_CreatePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200':
          description: Success. Exact 2xx code not captured; the module accepts any 2xx [I].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        default:
          description: Error body as read by the REST client [S].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bapToken: []
      x-confidence:
        route: Verified from source
        api_version: 'Verified from source: no api-version is sent'
        body: Verified from source; fields mixed (I/S), see Basis column
        response: Inferred
        live: Not verified live
      x-cmdlets:
      - New-DlpPolicy
      x-source:
      - Microsoft.PowerApps.Administration.PowerShell.psm1:7204 (New-DlpPolicy)
      x-caveats:
      - '[S] New-DlpPolicy (Name parameter set) sends displayName, defaultConnectorsClassification (default General), connectorGroups:
        [], environmentType, environments (default []) and etag: null (Administration.PowerShell.psm1 ~7204-7218).'
      - '[S] With -NewPolicy the caller''s object is sent unchanged.'
      - '[I] Valid environmentType values are believed to be AllEnvironments, OnlyEnvironments and ExceptEnvironments. They
        are not listed in the module source or on Learn.'
