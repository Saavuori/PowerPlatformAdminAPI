components:
  schemas:
    Policy:
      type: object
      properties:
        name:
          type: string
          description: Policy id (GUID). Learn calls the GUID the PolicyName; the property name is assumed.
          x-basis: I
        displayName:
          type: string
          description: Display name. Sent by New-DlpPolicy.
          x-basis: S
        defaultConnectorsClassification:
          allOf:
          - $ref: '#/components/schemas/Classification'
          description: 'Group for connectors not explicitly classified. New-DlpPolicy default: General.'
          x-basis: S
        connectorGroups:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorGroup'
          description: One entry per classification. Read and edited by Add-ConnectorsToPolicy.
          x-basis: S
        environmentType:
          allOf:
          - $ref: '#/components/schemas/EnvironmentType'
          description: Which environments the policy covers. Sent by New-DlpPolicy; allowed values are inferred.
          x-basis: S
        environments:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentRef'
          description: Environments included or excluded according to environmentType. New-DlpPolicy default empty array.
          x-basis: S
        etag:
          type: string
          description: Concurrency token. New-DlpPolicy sends null on create.
          x-basis: S
        createdBy:
          type: object
          description: Creator principal (read-only).
          x-basis: I
        createdTime:
          type: string
          format: date-time
          description: Read-only.
          x-basis: I
        lastModifiedBy:
          type: object
          description: Read-only.
          x-basis: I
        lastModifiedTime:
          type: string
          format: date-time
          description: Read-only.
          x-basis: I
      description: A data policy (DLP) in the current schema, as sent and received on PowerPlatform.Governance/v1/policies.
    PolicyList:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
          description: Read by InvokeApi paging.
          x-basis: S
        nextLink:
          type: string
          description: Next page URL; absent on the last page.
          x-basis: S
      description: Page of policies. InvokeApi follows nextLink and merges value arrays.
    ConnectorGroup:
      type: object
      properties:
        classification:
          allOf:
          - $ref: '#/components/schemas/Classification'
          description: 'Group name. Add-ConnectorsToPolicy ValidateSet: General, Confidential, Blocked.'
          x-basis: S
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorRef'
          description: Connectors in the group.
          x-basis: S
      description: Connectors sharing one classification inside a policy.
    ConnectorRef:
      type: object
      properties:
        id:
          type: string
          description: Connector resource id, e.g. /providers/Microsoft.PowerApps/apis/shared_msnweather [D].
          x-basis: S
        name:
          type: string
          description: Connector display name.
          x-basis: S
        type:
          type: string
          description: Resource type, e.g. providers/Microsoft.PowerApps/apis [D].
          x-basis: S
      description: Reference to a connector inside a policy group.
    EnvironmentRef:
      type: object
      properties:
        id:
          type: string
          description: Environment resource id.
          x-basis: I
        name:
          type: string
          description: Environment name (GUID).
          x-basis: I
        type:
          type: string
          description: Resource type, e.g. Microsoft.BusinessAppPlatform/scopes/environments.
          x-basis: I
      description: Reference to an environment inside a policy.
    Classification:
      type: string
      enum:
      - Confidential
      - General
      - Blocked
      description: Connector group classification.
      x-basis:
        Confidential: S
        General: S
        Blocked: S
    EnvironmentType:
      type: string
      enum:
      - AllEnvironments
      - OnlyEnvironments
      - ExceptEnvironments
      description: Policy scope. Values not present in module source or Learn.
      x-basis:
        AllEnvironments: I
        OnlyEnvironments: I
        ExceptEnvironments: I
    ConnectorConfigurations:
      type: object
      properties:
        connectorActionConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorActionConfiguration'
          description: One entry per connector.
          x-basis: D
        endpointConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/EndpointConfiguration'
          description: One entry per connector.
          x-basis: D
      description: Per-policy connector action rules and endpoint filtering rules (Learn, Connector action control / Connector
        endpoint filtering).
    ConnectorActionConfiguration:
      type: object
      properties:
        connectorId:
          type: string
          description: Connector id.
          x-basis: D
        actionRules:
          type: array
          items:
            $ref: '#/components/schemas/ActionRule'
          description: One entry per action.
          x-basis: D
        defaultConnectorActionRuleBehavior:
          type: string
          description: Allow or Block, for actions without a rule (including future actions).
          x-basis: D
    ActionRule:
      type: object
      properties:
        actionId:
          type: string
          description: Operation id from List Connector Actions.
          x-basis: D
        behavior:
          type: string
          description: Allow or Block.
          x-basis: D
    EndpointConfiguration:
      type: object
      properties:
        connectorId:
          type: string
          description: Connector id.
          x-basis: D
        endpointRules:
          type: array
          items:
            $ref: '#/components/schemas/EndpointRule'
          description: Ordered rules; the last must be *.
          x-basis: D
    EndpointRule:
      type: object
      properties:
        order:
          type: integer
          description: 1..N.
          x-basis: D
        endpoint:
          type: string
          description: Endpoint pattern; format depends on the connector (URL, server,database, host:port).
          x-basis: D
        behavior:
          type: string
          description: Allow or Deny.
          x-basis: D
    ExemptResources:
      type: object
      properties:
        exemptResources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
          description: Exempted resources.
          x-basis: D
      description: Apps and flows exempt from a policy (Learn, Data resource exemption cmdlets).
    ResourceRef:
      type: object
      properties:
        id:
          type: string
          description: App or flow resource id.
          x-basis: D
        type:
          type: string
          description: Resource type, e.g. Microsoft.ProcessSimple/environments/flows.
          x-basis: D
    UrlPatterns:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/UrlPatternRule'
          description: Ordered rules; * last.
          x-basis: D
      description: Ordered custom connector URL pattern rules (Learn, Data policies for custom connectors).
    UrlPatternRule:
      type: object
      properties:
        order:
          type: integer
          description: Starts at 1.
          x-basis: D
        customConnectorRuleClassification:
          type: string
          description: General, Confidential, Blocked or Ignore (Ignore only on the final * rule).
          x-basis: D
        pattern:
          type: string
          description: Host URL pattern.
          x-basis: D
    ConnectorBlockingPolicy:
      type: object
      properties:
        connectorSettings:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorSetting'
          description: One entry per connector. The cmdlet reads ConnectorSettings[].id [S].
          x-basis: D
        id:
          type: string
          description: Policy id returned by the service; Learn says Get output includes the policyId.
          x-basis: I
      description: Tenant connector blocking (enablement) definition (Learn, New connectors disabled by default).
    ConnectorBlockingPolicyList:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorBlockingPolicy'
          description: Policies (normally zero or one).
          x-basis: I
    ConnectorSetting:
      type: object
      properties:
        id:
          type: string
          description: Connector id. Its last segment is checked against the always-enabled list [S].
          x-basis: D
        behavior:
          type: string
          description: Allow or Deny.
          x-basis: D
        isReviewed:
          type: boolean
          description: Whether an admin has reviewed the connector.
          x-basis: D
    ErrorSettings:
      type: object
      properties:
        errorMessageDetails:
          type: object
          description: '{ enabled: boolean, url: string }: link to governance material.'
          x-basis: D
        contactDetails:
          type: object
          description: '{ enabled: boolean, email: string }: governance contact.'
          x-basis: D
      description: Governance error message content (Learn, Governance error message content commands).
    TenantIsolationPolicy:
      type: object
      properties:
        properties:
          type: object
          properties:
            isDisabled:
              type: boolean
              description: False when isolation is on.
              x-basis: I
            allowedTenants:
              type: array
              items:
                type: object
              description: 'Allow list entries: tenantId plus direction { inbound, outbound }. Learn documents the concept
                (inbound/outbound, * for all tenants) but not the JSON.'
              x-basis: I
      description: Cross-tenant isolation policy. Shape not present in module source or Learn; fields below are assumptions.
    LegacyApiPolicy:
      type: object
      properties:
        id:
          type: string
          description: Empty on create.
          x-basis: S
        name:
          type: string
          description: Empty on create; policy GUID afterwards.
          x-basis: S
        type:
          type: string
          description: Microsoft.BusinessAppPlatform/scopes/apiPolicies or …/scopes/environments/apiPolicies.
          x-basis: S
        tags:
          type: object
          description: Empty object.
          x-basis: S
        properties:
          type: object
          properties:
            createdTime:
              type: string
              format: date-time
              description: Client timestamp (Get-Date -Format o).
              x-basis: S
            displayName:
              type: string
              description: Display name.
              x-basis: S
            definition:
              type: object
              properties:
                $schema:
                  type: string
                  description: apiPolicyDefinition.json schema URL.
                  x-basis: S
                defaultApiGroup:
                  type: string
                  description: hbi or lbi.
                  x-basis: S
                constraints:
                  type: object
                  description: 'Optional environmentFilter1 { type: environmentFilter, parameters { filterType: include|exclude,
                    environments: [{id,name,type}] } }.'
                  x-basis: S
                apiGroups:
                  type: object
                  properties:
                    hbi:
                      type: object
                      description: '{ description, apis: [{id,name,type}] }: business data group.'
                      x-basis: S
                    lbi:
                      type: object
                      description: '{ description, apis: [...] }: non-business group.'
                      x-basis: S
                rules:
                  type: object
                  properties:
                    dataFlowRule:
                      type: object
                      description: 'Blocks data flow hbi → lbi: { type: DataFlowRestriction, parameters { sourceApiGroup:
                        hbi, destinationApiGroup: lbi }, actions { blockAction { type: Block } } }.'
                      x-basis: S
                    apiGroupRule:
                      type: object
                      description: 'Optional; blocks the lbi group: { type: ApiGroupRestriction, parameters { apiGroup: lbi
                        }, actions { blockAction { type: Block } } }.'
                      x-basis: S
      description: Legacy DLP policy object built by New-AdminDlpPolicy (all fields read from the source literal).
    LegacyApiPolicyList:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/LegacyApiPolicy'
          description: Read by Get-FilteredApiPolicies.
          x-basis: S
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
